name: Build Quest-RPG APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -o quest-rpg.zip -d .

    - name: List all files
      run: |
        ls -la
        find . -name "gradlew" -type f

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Make Gradle executable
      run: |
        # Chercher gradlew partout
        chmod +x $(find . -name "gradlew" -type f) || echo "gradlew not found"

    - name: Build APK
      run: |
        # Utiliser gradlew où qu'il soit
        ./gradlew assembleDebug || $(find . -name "gradlew" -type f) assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Quest-RPG-APK
        path: app/build/outputs/apk/debug/app-debug.apk
